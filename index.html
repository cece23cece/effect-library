<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effect Library • v3.68</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .effect-card { transition: all 0.2s; }
        .nav-tab.active { background-color: #18181b; color: white; border-radius: 9999px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

<div class="max-w-screen-xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-zinc-800 px-6 py-4">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-violet-600 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-images"></i>
            </div>
            <h1 class="font-display text-2xl font-semibold tracking-tight">Effect Library <span class="text-xs align-super text-zinc-500">v3.68</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="stats" class="text-xs bg-zinc-900 px-4 py-2 rounded-2xl border border-zinc-800">0 effects • 0 links</div>
            <button onclick="exportData()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-2xl text-sm">
                <i class="fa-solid fa-download"></i> Export
            </button>
            <button onclick="importData()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-2xl text-sm">
                <i class="fa-solid fa-upload"></i> Import
            </button>
            <button onclick="fullAppBackup()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-500 px-5 py-2 rounded-2xl text-sm">
                <i class="fa-solid fa-floppy-disk"></i> 💾 Full Backup
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 px-6 py-4 border-b border-zinc-800">
        <button onclick="switchTab(0)" id="tab0" class="nav-tab active px-6 py-3">Manage</button>
        <button onclick="switchTab(1)" id="tab1" class="nav-tab px-6 py-3">Prompt Builder</button>
        <button onclick="switchTab(2)" id="tab2" class="nav-tab px-6 py-3">Sources</button>
    </div>

    <!-- Manage Tab -->
    <div id="tab-content-0" class="p-6">
        <div class="flex gap-6">
            <!-- Categories Sidebar -->
            <div class="w-64 bg-zinc-900 border border-zinc-800 rounded-3xl p-4">
                <h3 class="font-semibold mb-4">Categories</h3>
                <div id="categories-list"></div>
            </div>
            <!-- Effects Grid -->
            <div class="flex-1">
                <div class="flex justify-between mb-6">
                    <h2 id="category-title" class="text-2xl font-semibold">All Effects</h2>
                    <button onclick="addNewEffect()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-2xl">+ Add Effect</button>
                </div>
                <div id="effects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>
    </div>

    <!-- Prompt Builder Tab -->
    <div id="tab-content-1" class="p-6 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-12 text-center">
            <p class="text-xl text-zinc-400">Prompt Builder will be restored in the next update.</p>
        </div>
    </div>

    <!-- Sources Tab -->
    <div id="tab-content-2" class="p-6 hidden">
        <div class="max-w-2xl mx-auto">
            <button onclick="addNewSource()" class="mb-6 bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-2xl flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Add New Source
            </button>
            <div id="sources-container" class="space-y-3"></div>
        </div>
    </div>
</div>

<!-- Source Modal -->
<div id="source-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4">
        <div class="p-6 border-b border-zinc-700">
            <h3 class="text-xl font-semibold">Add New Source</h3>
        </div>
        <div class="p-6 space-y-6">
            <input id="src-name" type="text" placeholder="Source name (e.g. Grok Imagine)" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4">
            <input id="src-type" type="text" placeholder="Type (optional)" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4">
            <div class="flex gap-4">
                <button onclick="saveNewSource()" class="flex-1 bg-indigo-600 py-4 rounded-2xl font-medium">Add Source</button>
                <button onclick="closeSourceModal()" class="flex-1 bg-zinc-800 py-4 rounded-2xl">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== CORE VARIABLES & DB ====================
let effects = [];
let categories = [];
let sources = [];

// Simple in-memory + IndexedDB fallback
const DB_NAME = "EffectLibrary";
let db;

async function initDB() {
    return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 3);
        req.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("sources")) db.createObjectStore("sources", {keyPath: "id"});
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
    });
}

async function loadData() {
    await initDB();
    // Load sources
    const tx = db.transaction("sources", "readonly");
    const store = tx.objectStore("sources");
    const req = store.getAll();
    req.onsuccess = () => {
        sources = req.result || [];
        renderSources();
    };
    // TODO: load effects/categories from localStorage or IndexedDB as before
    renderStats();
}

function saveSources() {
    const tx = db.transaction("sources", "readwrite");
    const store = tx.objectStore("sources");
    store.clear();
    sources.forEach(s => store.put(s));
}

// ==================== SOURCES ====================
function renderSources() {
    const container = document.getElementById("sources-container");
    container.innerHTML = sources.length === 0 
        ? `<p class="text-zinc-500 text-center py-12">No sources yet. Add your first one above.</p>`
        : sources.map((s, i) => `
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 flex justify-between items-center">
                <div>
                    <div class="font-medium">${s.name}</div>
                    <div class="text-xs text-zinc-500">${s.type || ''}</div>
                </div>
                <button onclick="deleteSource(${i})" class="text-red-400 hover:text-red-500">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        `).join('');
}

function addNewSource() {
    document.getElementById("source-modal").classList.remove("hidden");
}

function closeSourceModal() {
    document.getElementById("source-modal").classList.add("hidden");
}

function saveNewSource() {
    const name = document.getElementById("src-name").value.trim();
    if (!name) return alert("Name is required");
    sources.unshift({
        id: Date.now(),
        name: name,
        type: document.getElementById("src-type").value.trim()
    });
    saveSources();
    renderSources();
    closeSourceModal();
}

function deleteSource(i) {
    if (confirm("Delete this source?")) {
        sources.splice(i, 1);
        saveSources();
        renderSources();
    }
}

// ==================== BACKUP & IMPORT/EXPORT ====================
function fullAppBackup() {
    const backup = {
        version: "3.68",
        date: new Date().toISOString(),
        sources: sources,
        // effects and categories would be added here in full version
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `EffectLibrary_FullBackup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function exportData() {
    fullAppBackup(); // reuse for now
}

function importData() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.sources) {
                    sources = data.sources;
                    saveSources();
                    renderSources();
                    alert("Import successful!");
                }
            } catch(err) { alert("Invalid backup file"); }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ==================== TAB SWITCHING ====================
function switchTab(n) {
    document.querySelectorAll("[id^='tab-content-']").forEach(el => el.classList.add("hidden"));
    document.getElementById("tab-content-" + n).classList.remove("hidden");
    document.querySelectorAll(".nav-tab").forEach((t,i) => {
        t.classList.toggle("active", i === n);
    });
    if (n === 2) renderSources();
}

function renderStats() {
    document.getElementById("stats").textContent = `${effects.length} effects • ${sources.length} sources`;
}

// Init
window.onload = () => {
    loadData();
    switchTab(0);
    console.log("✅ v3.68 loaded");
};
</script>
</body>
</html>
